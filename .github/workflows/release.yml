name: Release

# Builds the macOS Manager app (Apple Silicon) and the turzx CLI, and attaches
# them to a GitHub release. Push a tag such as v1.0.0, or run it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libusb
        run: brew install libusb pkg-config
      - name: Test
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig"
          go test ./...
      - name: Build the Manager app
        run: ./packaging/manager-app/build-app.sh
      - name: Build the turzx CLI
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig"
          CC=clang go build -o turzx ./cmd/turzx
      - name: Package
        run: |
          mkdir dist
          ditto -c -k --keepParent "packaging/manager-app/Turing Monitor Manager.app" \
            dist/Turing-Monitor-Manager-macos-arm64.zip
          zip -j dist/turzx-macos-arm64.zip turzx
          (cd dist && shasum -a 256 *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Unsigned builds for Apple Silicon.** After downloading, right-click > Open, or run
            `xattr -dr com.apple.quarantine "Turing Monitor Manager.app"`. The app needs Screen
            Recording permission. `turzx` needs `brew install libusb`.
